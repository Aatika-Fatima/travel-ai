<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyStack — Architecture</title>
<style>
  :root {
    --bg: #f3f9ff;
    --surface: #ffffff;
    --surface-alt: #eaf3ff;
    --ink: #0e2c56;
    --ink-soft: #3f5b82;
    --muted: #6b7c99;
    --border: #d6e6fb;
    --brand: #0e2c56;
    --brand-800: #123a70;
    --accent: #1e88e5;
    --accent-soft: #e3f0ff;
    --good: #16794f;
    --warn: #a35a12;
    --code-bg: #0b1f3a;
    --code-ink: #dbe9ff;
    --shadow: 0 1px 2px rgba(14, 44, 86, 0.06), 0 10px 30px -14px rgba(14, 44, 86, 0.22);
    --rail-w: 264px;
    --header-h: 62px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    font-size: 15px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono {
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    font-size: 0.88em;
  }
  code {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 5px;
    color: var(--brand-800);
  }
  p { margin: 0.8em 0; max-width: 68ch; }
  h2 { font-size: clamp(20px, 3vw, 27px); letter-spacing: -0.02em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 26px 0 8px; letter-spacing: -0.01em; }
  ul, ol { margin: 0.7em 0; padding-left: 1.3em; max-width: 68ch; }
  li { margin: 0.35em 0; }

  /* ---------- site header (mirrors the portfolio's PortfolioHeader) ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: linear-gradient(to right, #0e2c56, #1e88e5);
    padding: 11px 16px;
    box-shadow: 0 4px 6px -1px rgba(14, 44, 86, 0.18);
  }
  .sh-inner {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sh-brand { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
  .sh-brand:hover { text-decoration: none; }
  .sh-brand .rocket { font-size: 22px; }
  .sh-brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .sh-brand .name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .sh-brand .name .light { font-weight: 300; color: rgba(255, 255, 255, 0.8); }
  .sh-brand .role { font-size: 11px; color: rgba(255, 255, 255, 0.7); }
  .sh-nav {
    order: 3;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 4px;
  }
  .sh-nav a {
    flex-shrink: 0;
    white-space: nowrap;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    transition: background-color 0.14s, color 0.14s;
  }
  .sh-nav a:hover { color: #fff; text-decoration: none; }
  .sh-nav a.current { background: #fff; color: #0e2c56; box-shadow: 0 1px 2px rgba(14, 44, 86, 0.12); }
  .sh-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.14s;
  }
  .sh-cta:hover { background: rgba(255, 255, 255, 0.2); text-decoration: none; }
  @media (min-width: 1024px) {
    .sh-nav { order: 0; width: auto; overflow: visible; }
  }

  .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); max-width: 1240px; margin: 0 auto; min-height: calc(100vh - var(--header-h)); }

  /* ---------- rail ---------- */
  .rail {
    position: sticky;
    top: var(--header-h);
    align-self: start;
    height: calc(100vh - var(--header-h));
    overflow-y: auto;
    padding: 26px 14px 40px 22px;
    border-right: 1px solid var(--border);
    background: var(--surface);
  }
  .rail-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .rail-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .nav-link {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.14s, color 0.14s;
  }
  .nav-link:hover { background: var(--surface-alt); text-decoration: none; color: var(--brand); }
  .nav-link .num {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    min-width: 18px;
  }
  .nav-link.active { background: var(--brand); color: #fff; font-weight: 600; }
  .nav-link.active .num { color: rgba(255, 255, 255, 0.6); }

  /* ---------- main ---------- */
  main { padding: 44px clamp(20px, 5vw, 64px) 90px; min-width: 0; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 10px; }
  .lede { color: var(--ink-soft); font-size: 16px; max-width: 66ch; }

  .panel { display: none; animation: fade 0.22s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    margin: 14px 0;
  }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 14px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; }
  .tile h4 { margin: 0 0 4px; font-size: 13.5px; color: var(--brand); }
  .tile p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: none; }
  .tile .ic { font-size: 18px; }

  .pill {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--brand-800);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 600;
    margin: 2px 3px 2px 0;
  }
  .pill.pub { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill.con { background: #fff; color: var(--accent); }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 11px 15px;
    margin: 16px 0;
    font-size: 13.5px;
    color: var(--brand-800);
    max-width: 68ch;
  }
  .callout.warn { border-color: var(--warn); background: #fbf1e4; color: var(--warn); }

  pre.code {
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.6;
    margin: 14px 0;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 14px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; background: var(--surface-alt); color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 9px 13px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }

  /* flow diagram */
  .flow { display: flex; flex-direction: column; gap: 0; margin: 16px 0; }
  .flow-step { display: flex; gap: 14px; }
  .flow-rail { display: flex; flex-direction: column; align-items: center; }
  .flow-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .flow-line { width: 2px; flex: 1; background: var(--border); min-height: 14px; }
  .flow-step:last-child .flow-line { display: none; }
  .flow-body { padding-bottom: 18px; }
  .flow-body .t { font-weight: 700; font-size: 14px; color: var(--brand); }
  .flow-body .a { font-size: 12px; font-weight: 600; color: var(--accent); }
  .flow-body p { margin: 4px 0 6px; font-size: 13px; }

  footer { border-top: 1px solid var(--border); padding: 20px clamp(20px, 5vw, 64px); font-size: 12px; color: var(--muted); }

  /* mermaid diagrams */
  .diagram {
    overflow-x: auto;
    margin: 16px 0;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .diagram .mermaid { text-align: center; }
  .diagram .mermaid svg { max-width: 100%; height: auto; }
  /* wide horizontal diagrams: render at a legible size and scroll instead of shrinking to fit */
  .diagram.wide .mermaid { min-width: 1120px; }
  .diagram.wide .mermaid svg { max-width: none; }
  .dcaption { font-size: 12px; color: var(--muted); margin: -4px 0 18px; max-width: 68ch; }

  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--border); }
    .nav-list { flex-direction: row; flex-wrap: wrap; }
    .nav-link { font-size: 12.5px; padding: 6px 9px; }
    main { padding: 28px 20px 70px; }
  }
</style>
</head>

  Container_Boundary(host, "EC2 host — Docker Compose") {

    id: "service-boundaries",

      <h3>Why events, not calls</h3>
      <p>An in-process method call between <code>booking-service</code> and <code>order-service</code> would be simpler to write
      and impossible to split later without a rewrite. Routing every cross-domain interaction through Kafka means the modules
      only share a message contract, the saga survives a consumer being down, and pulling <code>payment-service</code> out into
      its own deployment is a config change, not a refactor.</p>

      <pre class="code">producer:  acks=all, enable.idempotence=true        (no lost or duplicated-on-retry writes)
consumer:  manual ack, per-module group + config     (offset commits only after the handler succeeds)
topics:    single broker, KRaft mode, heap capped 256m</pre>

        <div class="tile"><div class="ic">🛡️</div><h4>Host</h4><p>SSH restricted to a single IP (or closed entirely in favour of SSM); IMDSv2 required; a zero-spend budget alarm guards the AWS account.</p></div>
      </div>

      <h3>Deploy path</h3>
      <p>CI authenticates to AWS with <strong>GitHub OIDC</strong> (short-lived role assumption, no stored key) and runs the
      deploy through <strong>SSM Send-Command</strong> &mdash; so the pipeline needs no inbound SSH and no long-lived
      credential anywhere.</p>
    `,
  },
  {
    id: "observability",
    title: "Observability",
    lede: "Enough signal to know the box is healthy and to debug a failed deploy — without a monitoring stack it can't afford to run.",
    html: `
      <div class="grid">
        <div class="tile"><div class="ic">❤️</div><h4>Actuator health</h4><p><code>/actuator/health</code> with liveness / readiness groups; the ES health contributor is disabled in the AWS profile.</p></div>
        <div class="tile"><div class="ic">🧬</div><h4>Migration logs</h4><p>Flyway logs every applied version on startup — the first thing to check after a deploy.</p></div>
        <div class="tile"><div class="ic">📦</div><h4>Container logs &amp; stats</h4><p><code>docker logs</code> / <code>docker stats</code> for per-service output and live memory against the 1&nbsp;GiB ceiling.</p></div>
        <div class="tile"><div class="ic">🚦</div><h4>Deploy gate</h4><p>The pipeline polls the health endpoint and fails the run if the app doesn't come back up.</p></div>
      </div>
      <div class="callout">Deliberately minimal. The engineering experience behind this project includes Graylog + Grafana across
      a fleet of payment services &mdash; here, the right call for 5 requests a day is Actuator plus structured logs, not a
      monitoring stack that costs more than the app.</div>
    `,
  },
  {
    id: "failure-recovery",
    title: "Failure & Recovery",
    lede: "What happens when a message is bad, a service is down, a deploy breaks, or the box runs out of memory.",
    html: `
      <div class="table-wrap"><table>
        <thead><tr><th>Failure</th><th>Handling</th></tr></thead>
        <tbody>
          <tr><td>Malformed / poison Kafka message</td><td>Logged, offset committed, partition keeps moving</td></tr>
          <tr><td>Email send fails</td><td><code>@RetryableTopic</code>: 3 attempts, 5→30&nbsp;min backoff, then DLQ handler</td></tr>
          <tr><td>Concurrent update to the same order</td><td>Optimistic-lock version conflict → <code>@Retryable</code></td></tr>
          <tr><td>Consumer down when an event is published</td><td>Outbox holds it; delivered on restart (at-least-once)</td></tr>
          <tr><td>Saga stalls between states</td><td><code>BookingExpirySweep</code> + <code>ReconciliationJob</code> resolve it out of band</td></tr>
          <tr><td>Bad deploy</td><td>Health poll fails the CI run; no auto-rollback — fix forward with the next push</td></tr>
          <tr><td>JVM pressure on the 1&nbsp;GiB box</td><td>Heap flags capped per service (<code>-Xmx</code>), 2&nbsp;GiB swap file, <code>ExitOnOutOfMemoryError</code> + <code>restart: unless-stopped</code></td></tr>
        </tbody>
      </table></div>

  {
    id: "architecture-decisions",
    title: "Architecture Decisions",
    lede: "The trade-offs, stated plainly — each one is a choice, not a default.",
    html: `
      <h3>Modular monolith, not microservices</h3>
      <p>Real traffic is a few requests a day. Six deployments would be six things to run, secure, and pay for, to serve load a

      warranted.</p>

      <h3>Local PostgreSQL, not RDS</h3>
      <p>RDS free tier is free for 12 months, then it bills silently. For a demo that might not be revisited for a year, that's
      a landmine. A Postgres container on the same box costs nothing and never expires.</p>

      <p>Overkill for the traffic by any load argument &mdash; but the outbox saga is the point of the project. It stays, with

      <p>It was a write-only sink; the read path was already 100% Postgres. <code>pg_trgm</code> covers typo-tolerant search,

const navList = document.getElementById("navList");
const main = document.getElementById("main");

if (window.mermaid) {
  mermaid.initialize({
    startOnLoad: false,
    theme: "base",
    themeVariables: {
      primaryColor: "#e3f0ff",
      primaryBorderColor: "#1e88e5",
      primaryTextColor: "#0e2c56",
      secondaryColor: "#f3f9ff",
      tertiaryColor: "#ffffff",
      lineColor: "#6b7c99",
      fontFamily: '"Inter","Segoe UI",system-ui,-apple-system,sans-serif',
      fontSize: "13px",
    },
    flowchart: { htmlLabels: true, curve: "basis", nodeSpacing: 45, rankSpacing: 55 },
    securityLevel: "loose",
  });
}

// Diagrams render the first time their panel becomes visible -- C4 layout in
// particular measures the container, so rendering a display:none panel can
// come out mis-sized.
async function renderDiagrams(panel) {
  if (!panel || !window.mermaid) return;
  const pending = panel.querySelectorAll(".mermaid:not([data-processed])");
  if (!pending.length) return;
  try {
    await mermaid.run({ nodes: pending });
  } catch (e) {
    console.error("mermaid render failed", e);
  }
}

SECTIONS.forEach((s, i) => {
  const li = document.createElement("li");
  const a = document.createElement("a");
  a.className = "nav-link";
  a.href = "#" + s.id;
  a.dataset.id = s.id;
  a.innerHTML = '<span class="num">' + String(i + 1).padStart(2, "0") + "</span><span>" + s.title + "</span>";
  li.appendChild(a);
  navList.appendChild(li);

  const panel = document.createElement("article");
  panel.className = "panel";
  panel.id = "panel-" + s.id;
  panel.innerHTML =
    '<div class="eyebrow">' + String(i + 1).padStart(2, "0") + " · ARCHITECTURE</div>" +
    "<h2>" + s.title + "</h2>" +
    '<p class="lede">' + s.lede + "</p>" +
    s.html;
  main.appendChild(panel);
});

function show(id) {
  const target = SECTIONS.some((s) => s.id === id) ? id : SECTIONS[0].id;
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + target));
  document.querySelectorAll(".nav-link").forEach((n) => n.classList.toggle("active", n.dataset.id === target));
  window.scrollTo(0, 0);
  renderDiagrams(document.getElementById("panel-" + target));
}

navList.addEventListener("click", (e) => {
  const link = e.target.closest(".nav-link");
  if (!link) return;
  e.preventDefault();
  history.replaceState(null, "", "#" + link.dataset.id);
  show(link.dataset.id);
});

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
