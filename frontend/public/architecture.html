<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FlyStack — Architecture</title>
<style>
  :root {
    --bg: #f3f9ff;
    --surface: #ffffff;
    --surface-alt: #eaf3ff;
    --ink: #0e2c56;
    --ink-soft: #3f5b82;
    --muted: #6b7c99;
    --border: #d6e6fb;
    --brand: #0e2c56;
    --brand-800: #123a70;
    --accent: #1e88e5;
    --accent-soft: #e3f0ff;
    --good: #16794f;
    --warn: #a35a12;
    --code-bg: #0b1f3a;
    --code-ink: #dbe9ff;
    --shadow: 0 1px 2px rgba(14, 44, 86, 0.06), 0 10px 30px -14px rgba(14, 44, 86, 0.22);
    --rail-w: 264px;
    --header-h: 62px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    font-size: 15px;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  code, .mono {
    font-family: ui-monospace, "Cascadia Code", "SF Mono", Consolas, monospace;
    font-size: 0.88em;
  }
  code {
    background: var(--surface-alt);
    border: 1px solid var(--border);
    padding: 1px 5px;
    border-radius: 5px;
    color: var(--brand-800);
  }
  p { margin: 0.8em 0; max-width: 68ch; }
  h2 { font-size: clamp(20px, 3vw, 27px); letter-spacing: -0.02em; margin: 0 0 4px; }
  h3 { font-size: 15px; margin: 26px 0 8px; letter-spacing: -0.01em; }
  ul, ol { margin: 0.7em 0; padding-left: 1.3em; max-width: 68ch; }
  li { margin: 0.35em 0; }

  /* ---------- site header (mirrors the portfolio's PortfolioHeader) ---------- */
  .site-header {
    position: sticky;
    top: 0;
    z-index: 30;
    background: linear-gradient(to right, #0e2c56, #1e88e5);
    padding: 11px 16px;
    box-shadow: 0 4px 6px -1px rgba(14, 44, 86, 0.18);
  }
  .sh-inner {
    max-width: 1240px;
    margin: 0 auto;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }
  .sh-brand { display: flex; align-items: center; gap: 8px; color: #fff; text-decoration: none; }
  .sh-brand:hover { text-decoration: none; }
  .sh-brand .rocket { font-size: 22px; }
  .sh-brand-text { display: flex; flex-direction: column; line-height: 1.15; }
  .sh-brand .name { font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
  .sh-brand .name .light { font-weight: 300; color: rgba(255, 255, 255, 0.8); }
  .sh-brand .role { font-size: 11px; color: rgba(255, 255, 255, 0.7); }
  .sh-nav {
    order: 3;
    width: 100%;
    display: flex;
    align-items: center;
    gap: 4px;
    overflow-x: auto;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 999px;
    padding: 4px;
  }
  .sh-nav a {
    flex-shrink: 0;
    white-space: nowrap;
    border-radius: 999px;
    padding: 6px 14px;
    font-size: 14px;
    font-weight: 600;
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    transition: background-color 0.14s, color 0.14s;
  }
  .sh-nav a:hover { color: #fff; text-decoration: none; }
  .sh-nav a.current { background: #fff; color: #0e2c56; box-shadow: 0 1px 2px rgba(14, 44, 86, 0.12); }
  .sh-cta {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border-radius: 999px;
    padding: 6px 12px;
    background: rgba(255, 255, 255, 0.1);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    text-decoration: none;
    transition: background-color 0.14s;
  }
  .sh-cta:hover { background: rgba(255, 255, 255, 0.2); text-decoration: none; }
  @media (min-width: 1024px) {
    .sh-nav { order: 0; width: auto; overflow: visible; }
  }

  .shell { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); max-width: 1240px; margin: 0 auto; min-height: calc(100vh - var(--header-h)); }

  /* ---------- rail ---------- */
  .rail {
    position: sticky;
    top: var(--header-h);
    align-self: start;
    height: calc(100vh - var(--header-h));
    overflow-y: auto;
    padding: 26px 14px 40px 22px;
    border-right: 1px solid var(--border);
    background: var(--surface);
  }
  .rail-back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 22px;
  }
  .rail-title {
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 0.22em;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .nav-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
  .nav-link {
    display: flex;
    gap: 10px;
    align-items: baseline;
    padding: 8px 10px;
    border-radius: 8px;
    color: var(--ink-soft);
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background-color 0.14s, color 0.14s;
  }
  .nav-link:hover { background: var(--surface-alt); text-decoration: none; color: var(--brand); }
  .nav-link .num {
    font-family: ui-monospace, Consolas, monospace;
    font-size: 11px;
    font-weight: 700;
    color: var(--muted);
    min-width: 18px;
  }
  .nav-link.active { background: var(--brand); color: #fff; font-weight: 600; }
  .nav-link.active .num { color: rgba(255, 255, 255, 0.6); }

  /* ---------- main ---------- */
  main { padding: 44px clamp(20px, 5vw, 64px) 90px; min-width: 0; }
  .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: 0.2em; color: var(--accent); margin-bottom: 10px; }
  .lede { color: var(--ink-soft); font-size: 16px; max-width: 66ch; }

  .panel { display: none; animation: fade 0.22s ease; }
  .panel.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px 18px;
    box-shadow: var(--shadow);
    margin: 14px 0;
  }
  .grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); margin: 14px 0; }
  .tile { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 15px; }
  .tile h4 { margin: 0 0 4px; font-size: 13.5px; color: var(--brand); }
  .tile p { margin: 0; font-size: 12.5px; color: var(--muted); max-width: none; }
  .tile .ic { font-size: 18px; }

  .pill {
    display: inline-block;
    background: var(--accent-soft);
    color: var(--brand-800);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 2px 9px;
    font-size: 11px;
    font-weight: 600;
    margin: 2px 3px 2px 0;
  }
  .pill.pub { background: var(--accent); color: #fff; border-color: var(--accent); }
  .pill.con { background: #fff; color: var(--accent); }

  .callout {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    border-radius: 8px;
    padding: 11px 15px;
    margin: 16px 0;
    font-size: 13.5px;
    color: var(--brand-800);
    max-width: 68ch;
  }
  .callout.warn { border-color: var(--warn); background: #fbf1e4; color: var(--warn); }

  pre.code {
    background: var(--code-bg);
    color: var(--code-ink);
    border-radius: 10px;
    padding: 14px 16px;
    overflow-x: auto;
    font-size: 12.5px;
    line-height: 1.6;
    margin: 14px 0;
  }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 14px 0; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th { text-align: left; background: var(--surface-alt); color: var(--ink-soft); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; padding: 9px 13px; border-bottom: 1px solid var(--border); }
  td { padding: 9px 13px; border-bottom: 1px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  .table-wrap { overflow-x: auto; }

  /* flow diagram */
  .flow { display: flex; flex-direction: column; gap: 0; margin: 16px 0; }
  .flow-step { display: flex; gap: 14px; }
  .flow-rail { display: flex; flex-direction: column; align-items: center; }
  .flow-dot { width: 30px; height: 30px; border-radius: 50%; background: var(--brand); color: #fff; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .flow-line { width: 2px; flex: 1; background: var(--border); min-height: 14px; }
  .flow-step:last-child .flow-line { display: none; }
  .flow-body { padding-bottom: 18px; }
  .flow-body .t { font-weight: 700; font-size: 14px; color: var(--brand); }
  .flow-body .a { font-size: 12px; font-weight: 600; color: var(--accent); }
  .flow-body p { margin: 4px 0 6px; font-size: 13px; }

  footer { border-top: 1px solid var(--border); padding: 20px clamp(20px, 5vw, 64px); font-size: 12px; color: var(--muted); }

  /* mermaid diagrams */
  .diagram {
    overflow-x: auto;
    margin: 16px 0;
    padding: 10px 12px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
  }
  .diagram .mermaid { text-align: center; }
  .diagram .mermaid svg { max-width: 100%; height: auto; }
  /* wide horizontal diagrams: render at a legible size and scroll instead of shrinking to fit */
  .diagram.wide .mermaid { min-width: 1120px; }
  .diagram.wide .mermaid svg { max-width: none; }
  .dcaption { font-size: 12px; color: var(--muted); margin: -4px 0 18px; max-width: 68ch; }

  /* ---------- interactive system map ---------- */
  .sysmap {
    margin: 16px 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .sysmap-bar {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .sm-toggle {
    display: inline-flex;
    align-items: center;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink-soft);
    border-radius: 999px;
    padding: 6px 14px;
    font: 700 12.5px/1 inherit;
    cursor: pointer;
    transition: background-color 0.14s, color 0.14s, border-color 0.14s;
  }
  .sm-toggle:hover { border-color: var(--accent); color: var(--brand); }
  .sm-toggle.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .sm-legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); }
  .sm-key { display: inline-flex; align-items: center; gap: 6px; }
  .sm-key::before { content: ""; width: 18px; border-top: 2px solid currentColor; }
  .sm-key.http { color: var(--accent); }
  .sm-key.kafka { color: var(--brand); }
  .sm-key.ext { color: var(--warn); }
  .sm-key.ext::before { border-top-style: dashed; }

  .sysmap-stage { position: relative; overflow-x: auto; padding: 24px 16px; }
  .sm-canvas { position: relative; min-width: 780px; }
  .sm-edges { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; z-index: 0; }
  .sm-lanes {
    position: relative;
    z-index: 1;
    display: grid;
    grid-template-columns: 116px minmax(320px, 1fr) 150px;
    gap: 22px;
    align-items: start;
  }
  .sm-kafka-bar {
    position: relative;
    z-index: 1;
    margin: 20px 168px 0 138px;
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 12px;
    border-radius: 10px;
    padding: 8px 14px;
    background: var(--brand);
    color: #fff;
    box-shadow: var(--shadow);
  }
  .sm-kafka-bar .kb-name { font-size: 11px; font-weight: 800; letter-spacing: 0.04em; }
  .sm-kafka-bar .kb-topics { font-size: 10.5px; font-weight: 500; color: rgba(255, 255, 255, 0.72); font-family: ui-monospace, Consolas, monospace; }
  .sysmap-stage.saga .sm-kafka-bar { box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

  .sm-step { opacity: 0; transition: opacity 0.14s; }
  .sm-step circle { fill: var(--surface); stroke: var(--brand); stroke-width: 1.5; }
  .sm-step text { fill: var(--brand); font-size: 9px; font-weight: 800; }
  .sm-step.lit { opacity: 1; }
  .sm-step.lit circle { fill: var(--accent); stroke: var(--accent); }
  .sm-step.lit text { fill: #fff; }
  .sysmap-stage.saga .sm-step.saga { opacity: 1; }
  .sysmap-stage.saga .sm-step.saga circle { fill: var(--accent); stroke: var(--accent); }
  .sysmap-stage.saga .sm-step.saga text { fill: #fff; }
  .sm-lane { display: flex; flex-direction: column; gap: 6px; }
  .sm-lane-title {
    font-size: 9.5px;
    font-weight: 800;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .sm-lane-body { display: flex; flex-direction: column; gap: 14px; }
  .sm-lane.app {
    border: 1.5px dashed #b9d4f4;
    border-radius: 14px;
    padding: 12px 12px 14px;
    background: linear-gradient(180deg, rgba(227, 240, 255, 0.4), rgba(227, 240, 255, 0));
  }
  .sm-lane.app .sm-lane-title { color: var(--accent); margin-bottom: 4px; }
  .sm-lane.app .sm-lane-body { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }

  .sm-node {
    position: relative;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    text-align: left;
    border: 1px solid var(--border);
    background: var(--surface);
    border-radius: 10px;
    padding: 9px 11px;
    font: inherit;
    color: var(--ink);
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s, opacity 0.14s;
  }
  .sm-node:hover { transform: translateY(-2px); border-color: var(--accent); }
  .sm-node .ic { font-size: 16px; line-height: 1; flex-shrink: 0; }
  .sm-node .lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: -0.01em; }
  .sm-node .sub { display: block; font-size: 10px; font-weight: 500; color: var(--muted); margin-top: 1px; }
  .sm-node.kafka { background: var(--brand); border-color: var(--brand); color: #fff; }
  .sm-node.kafka .sub { color: rgba(255, 255, 255, 0.72); }
  .sm-node.ext { background: #fbf1e4; border-color: #ecd8bc; }
  .sm-node.ext .sub { color: #a97a3d; }
  .sm-node.sel { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent), var(--shadow); }

  .sysmap-stage[data-active] .sm-node:not(.lit) { opacity: 0.28; }
  .sysmap-stage[data-active] .sm-node:not(.lit):hover { opacity: 0.6; }

  .sm-edge { fill: none; stroke: var(--muted); stroke-width: 1.5; opacity: 0.85; }
  .sm-edge.http { stroke: var(--accent); }
  .sm-edge.kafka { stroke: var(--brand); stroke-width: 2; stroke-dasharray: 7 5; }
  .sm-edge.ext { stroke: var(--warn); stroke-dasharray: 5 4; }
  .sysmap-stage[data-active] .sm-edge:not(.lit) { opacity: 0.09; }
  .sm-edge.lit { stroke-width: 2.6; opacity: 1; }
  .sm-edge.flow { stroke-dasharray: 6 7; animation: sm-dash 0.9s linear infinite; }
  @keyframes sm-dash { to { stroke-dashoffset: -26; } }

  .sm-elabel {
    font-size: 9px;
    font-weight: 700;
    fill: var(--ink-soft);
    paint-order: stroke;
    stroke: var(--surface);
    stroke-width: 4px;
    stroke-linejoin: round;
    opacity: 0;
    transition: opacity 0.14s;
  }
  .sm-elabel.lit { opacity: 1; }

  .sysmap-stage.saga .sm-edge:not(.saga) { opacity: 0.07; }
  .sysmap-stage.saga .sm-node:not(.saga) { opacity: 0.24; }
  .sysmap-stage.saga .sm-edge.saga {
    stroke: var(--accent);
    stroke-width: 2.6;
    opacity: 1;
    stroke-dasharray: 6 7;
    animation: sm-dash 0.9s linear infinite;
  }
  .sysmap-stage.saga .sm-elabel.saga { opacity: 1; }

  .sm-detail { border-top: 1px solid var(--border); padding: 14px 16px; background: var(--surface-alt); }
  .sm-detail h4 { margin: 0 0 3px; font-size: 13.5px; color: var(--brand); }
  .sm-detail p { margin: 0; font-size: 12.5px; color: var(--ink-soft); max-width: 64ch; }
  .sm-detail .sm-tags { margin-top: 8px; }
  .sm-detail .sm-drill {
    display: inline-block;
    margin-top: 10px;
    border: 1px solid var(--accent);
    background: var(--accent);
    color: #fff;
    border-radius: 999px;
    padding: 5px 13px;
    font-size: 11.5px;
    font-weight: 700;
    cursor: pointer;
  }
  .sm-detail .sm-drill:hover { background: var(--accent-soft); color: var(--brand-800); }

  /* ---------- C4 explorer ---------- */
  .c4x {
    margin: 16px 0;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .c4-tabs {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 4px;
    padding: 10px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--surface-alt);
  }
  .c4-tab {
    border: 1px solid transparent;
    background: transparent;
    color: var(--muted);
    border-radius: 999px;
    padding: 5px 12px;
    font: 700 12px/1 inherit;
    cursor: pointer;
    transition: background-color 0.14s, color 0.14s, border-color 0.14s;
  }
  .c4-tab:hover { color: var(--brand); }
  .c4-tab.active { background: var(--brand); color: #fff; }
  .c4-sep { color: var(--muted); font-size: 12px; padding: 0 2px; }
  .c4-blurb {
    padding: 12px 16px 4px;
    font-size: 12.5px;
    color: var(--ink-soft);
    max-width: 70ch;
  }
  .c4-blurb code { font-size: 0.86em; }
  .sm-lane.box {
    border: 1.5px dashed #b9d4f4;
    border-radius: 14px;
    padding: 12px 12px 14px;
    background: linear-gradient(180deg, rgba(227, 240, 255, 0.4), rgba(227, 240, 255, 0));
  }
  .sm-lane.box > .sm-lane-title { color: var(--accent); margin-bottom: 4px; }
  .sm-lane.box > .sm-lane-body { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .sm-node.c4-person { background: var(--accent-soft); border-color: #bcdcff; }
  .sm-node.c4-system { background: var(--brand); border-color: var(--brand); color: #fff; }
  .sm-node.c4-system .sub { color: rgba(255, 255, 255, 0.74); }
  .sm-node.drill { cursor: zoom-in; padding-right: 24px; }
  .sm-node.drill::after {
    content: "⤢";
    position: absolute;
    top: 7px;
    right: 9px;
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
  }
  .sm-node.c4-system.drill::after { color: #fff; }
  .c4x .sm-lane:not(.box) .sm-node { max-width: 340px; }

  /* state-machine / event-arch nodes */
  .sm-node.sm-start {
    justify-content: center;
    gap: 0;
    background: var(--ink);
    border-color: var(--ink);
    color: #fff;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 0.08em;
  }
  .sm-node.sm-terminal { background: var(--surface-alt); border-style: dashed; }
  .sm-node.sm-terminal .lbl { color: var(--ink-soft); }
  .sm-node.sm-good { border-color: var(--good); box-shadow: inset 3px 0 0 var(--good), var(--shadow); }
  .sm-node.sm-bad { border-color: var(--warn); box-shadow: inset 3px 0 0 var(--warn), var(--shadow); }
  .sm-node.sm-topic { background: var(--brand); border-color: var(--brand); color: #fff; font-family: ui-monospace, Consolas, monospace; }
  .sm-node.sm-topic .lbl { font-weight: 700; }
  .sm-node.sm-topic .sub { color: rgba(255, 255, 255, 0.7); font-family: inherit; }
  .exp-lanes .sm-node { max-width: 280px; }
  .exp-lanes .sm-node .lbl { font-size: 11px; overflow-wrap: anywhere; line-height: 1.25; }
  .exp-lanes .sm-node.sm-start .lbl { font-size: 10px; }

  /* vertical (top-to-bottom) flow — event architecture */
  .exp-lanes.vertical { display: flex; flex-direction: column; gap: 44px; align-items: stretch; }
  .exp-lanes.vertical .sm-lane { align-items: center; gap: 0; }
  .exp-lanes.vertical .sm-lane-title {
    font-size: 8.5px;
    font-weight: 800;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 7px;
  }
  .exp-lanes.vertical .sm-lane-body { flex-direction: row; justify-content: center; flex-wrap: wrap; gap: 16px; }
  .exp-lanes.vertical .sm-node { width: 190px; max-width: 190px; }

async function renderDiagrams(panel) {
  if (!panel || !window.mermaid) return;
  const pending = panel.querySelectorAll(".mermaid:not([data-processed])");
  if (!pending.length) return;
  try {
    await mermaid.run({ nodes: pending });
  } catch (e) {
    console.error("mermaid render failed", e);
  }
}

// kind: http = REST or in-JVM call · kafka = a Kafka topic · ext = external / infra.
const SM_EDGES = [
  ["traveler", "spa", "", "http"],
  ["spa", "searchai", "AI chat", "http"],
  ["spa", "search", "search flights", "http"],
  ["spa", "order", "poll order status", "http"],
  ["searchai", "llm", "extract intent", "ext"],
  ["searchai", "search", "resolve airports", "http"],

  ["app", "pg", "JDBC · per-module tables + outbox", "ext"],

const KAFKA_TOPICS = "booking.events · order.events · payment.events · booking-events · email-events";

(function initSysmap() {
  const root = document.getElementById("sysmap");
  if (!root) return;
  const lanesEl = document.getElementById("smLanes");
  const canvas = document.getElementById("smCanvas");
  const svg = document.getElementById("smEdges");
  const stage = root.querySelector(".sysmap-stage");
  const detail = document.getElementById("smDetail");
  const sagaBtn = document.getElementById("smSaga");
  const SVGNS = "http://www.w3.org/2000/svg";
  const byId = {};
  SM_NODES.forEach((n) => (byId[n.id] = n));
  let built = false;
  let pinned = null;
  const edges = [];

  const sagaOn = () => stage.classList.contains("saga");

  function build() {
    SM_LANES.forEach((lane) => {
      const col = document.createElement("div");
      col.className = "sm-lane " + lane.id;
      if (lane.id === "app") col.id = "smLaneApp";
      col.innerHTML = '<div class="sm-lane-title">' + lane.title + "</div>";
      const body = document.createElement("div");
      body.className = "sm-lane-body";
      SM_NODES.filter((n) => n.lane === lane.id).forEach((n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sm-node" + (lane.id === "data" ? " ext" : "") + (n.saga ? " saga" : "");
        b.dataset.id = n.id;
        b.innerHTML =
          '<span class="ic">' + n.icon + '</span><span class="txt"><span class="lbl">' + n.label +
          '</span><span class="sub">' + n.sub + "</span></span>";
        const enter = () => { if (!sagaOn()) focus(n.id); };
        const leave = () => { if (!sagaOn()) restore(); };
        b.addEventListener("mouseenter", enter);
        b.addEventListener("mouseleave", leave);
        b.addEventListener("focus", enter);
        b.addEventListener("blur", leave);
        b.addEventListener("click", () => {
          if (sagaOn()) return;
          pinned = pinned === n.id ? null : n.id;
          document.querySelectorAll(".sm-node.sel").forEach((el) => el.classList.remove("sel"));
          if (pinned) {
            b.classList.add("sel");
            focus(pinned);
            detail.innerHTML =
              "<h4>" + n.icon + "&nbsp; " + n.label + "</h4><p>" + n.detail + "</p>" +
              (n.tags ? '<div class="sm-tags">' + n.tags.map((t) => '<span class="pill">' + t + "</span>").join("") + "</div>" : "");
            detail.hidden = false;
          } else {
            restore();
            detail.hidden = true;
          }
        });
        body.appendChild(b);
      });
      col.appendChild(body);
      lanesEl.appendChild(col);
    });

    // Kafka substrate: the navy dashed edges above all ride these topics.
    const bar = document.createElement("div");
    bar.className = "sm-kafka-bar";
    bar.innerHTML = '<span class="kb-name">📨 Apache Kafka (KRaft)</span><span class="kb-topics">' + KAFKA_TOPICS + "</span>";
    lanesEl.after(bar);

    // A node is "in the saga" if it sits on either end of a saga edge.
    const sagaSet = new Set();
    SM_EDGES.forEach(([a, b, , , saga]) => { if (saga) { sagaSet.add(a); sagaSet.add(b); } });
    sagaSet.forEach((id) => {
      if (!byId[id]) return;
      const el = lanesEl.querySelector('.sm-node[data-id="' + id + '"]');
      if (el) el.classList.add("saga");
    });

    SM_EDGES.forEach(([a, b, label, kind, saga, step]) => {
      const p = document.createElementNS(SVGNS, "path");
      p.setAttribute("class", "sm-edge " + kind + (saga ? " saga" : ""));
      p.setAttribute("marker-end", "url(#sm-tip)");
      svg.appendChild(p);
      let t = null;
      if (label) {
        t = document.createElementNS(SVGNS, "text");
        t.setAttribute("class", "sm-elabel" + (saga ? " saga" : ""));
        t.setAttribute("text-anchor", "middle");
        t.textContent = label;
        svg.appendChild(t);
      }
      let badge = null;
      if (step) {
        badge = document.createElementNS(SVGNS, "g");
        badge.setAttribute("class", "sm-step" + (saga ? " saga" : ""));
        const c = document.createElementNS(SVGNS, "circle");
        c.setAttribute("r", "8");
        const tx = document.createElementNS(SVGNS, "text");
        tx.setAttribute("text-anchor", "middle");
        tx.setAttribute("dy", "3");
        tx.textContent = String(step);
        badge.appendChild(c);
        badge.appendChild(tx);
        svg.appendChild(badge);
      }
      edges.push({ a, b, kind, saga: !!saga, step, path: p, text: t, badge });
    });

    stage.addEventListener("click", (ev) => {
      if (ev.target === stage || ev.target === canvas || ev.target === lanesEl) {
        pinned = null;
        document.querySelectorAll(".sm-node.sel").forEach((el) => el.classList.remove("sel"));
        restore();
        detail.hidden = true;
      }
    });
    sagaBtn.addEventListener("click", () => {
      const on = stage.classList.toggle("saga");
      sagaBtn.classList.toggle("on", on);
      sagaBtn.innerHTML = on ? "✕&nbsp; Clear saga trace" : "🔀&nbsp; Trace the booking saga";
      pinned = null;
      document.querySelectorAll(".sm-node.sel").forEach((el) => el.classList.remove("sel"));
      restore();
      detail.hidden = true;
    });

    built = true;
  }

  const NORMALS = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1] };
  function rectIn(el) {
    const r = el.getBoundingClientRect();
    const c = canvas.getBoundingClientRect();
    return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height };
  }
  function sides(f, t) {
    const dx = t.x + t.w / 2 - (f.x + f.w / 2);
    const dy = t.y + t.h / 2 - (f.y + f.h / 2);
    if (Math.abs(dx) >= Math.abs(dy)) return [dx > 0 ? "r" : "l", dx > 0 ? "l" : "r"];
    return [dy > 0 ? "b" : "t", dy > 0 ? "t" : "b"];
  }
  function anchor(r, s) {
    if (s === "r") return [r.x + r.w, r.y + r.h / 2];
    if (s === "l") return [r.x, r.y + r.h / 2];
    if (s === "t") return [r.x + r.w / 2, r.y];
    return [r.x + r.w / 2, r.y + r.h];
  }
  const resolve = (id) => (id === "app" ? document.getElementById("smLaneApp") : lanesEl.querySelector('.sm-node[data-id="' + id + '"]'));
  function bez(t, p0, c1, c2, p3) {
    const u = 1 - t;
    return u * u * u * p0 + 3 * u * u * t * c1 + 3 * u * t * t * c2 + t * t * t * p3;
  }

  function layout() {
    if (!built || !canvas.offsetWidth) return;
    const W = canvas.offsetWidth;
    const H = canvas.offsetHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    edges.forEach((e) => {
      const fe = resolve(e.a);
      const te = resolve(e.b);
      if (!fe || !te) return;
      const fr = rectIn(fe);
      const tr = rectIn(te);
      const [s1, s2] = sides(fr, tr);
      let [x1, y1] = anchor(fr, s1);
      let [x2, y2] = anchor(tr, s2);
      const reverse = edges.some((o) => o !== e && o.a === e.b && o.b === e.a);
      if (reverse) {
        const dx = x2 - x1;
        const dy = y2 - y1;
        const L = Math.hypot(dx, dy) || 1;
        const off = (e.a < e.b ? 1 : -1) * 10;
        x1 += (-dy / L) * off; y1 += (dx / L) * off;
        x2 += (-dy / L) * off; y2 += (dx / L) * off;
      }
      const k = Math.max(34, Math.min(150, Math.hypot(x2 - x1, y2 - y1) * 0.42));
      const n1 = NORMALS[s1];
      const n2 = NORMALS[s2];
      const c1x = x1 + n1[0] * k;
      const c1y = y1 + n1[1] * k;
      const c2x = x2 + n2[0] * k;
      const c2y = y2 + n2[1] * k;
      e.path.setAttribute("d", "M " + x1 + " " + y1 + " C " + c1x + " " + c1y + " " + c2x + " " + c2y + " " + x2 + " " + y2);
      if (e.text) {
        const lt = e.step ? 0.5 : 0.32;
        e.text.setAttribute("x", bez(lt, x1, c1x, c2x, x2));
        e.text.setAttribute("y", bez(lt, y1, c1y, c2y, y2) - (e.step ? 12 : 4));
      }
      if (e.badge) {
        e.badge.setAttribute("transform",
          "translate(" + bez(0.5, x1, c1x, c2x, x2) + " " + bez(0.5, y1, c1y, c2y, y2) + ")");
      }
    });
  }

  function connected(id) {
    const nodes = new Set([id]);
    const idx = new Set();
    const inApp = byId[id] && byId[id].lane === "app";
    edges.forEach((e, i) => {
      const hit = e.a === id || e.b === id || (inApp && (e.a === "app" || e.b === "app"));
      if (!hit) return;
      idx.add(i);
      if (e.a !== "app") nodes.add(e.a);
      if (e.b !== "app") nodes.add(e.b);
    });
    return { nodes, idx };
  }
  function focus(id) {
    const { nodes, idx } = connected(id);
    stage.setAttribute("data-active", "");
    lanesEl.querySelectorAll(".sm-node").forEach((n) => n.classList.toggle("lit", nodes.has(n.dataset.id)));
    edges.forEach((e, i) => {
      const on = idx.has(i);
      e.path.classList.toggle("lit", on);
      e.path.classList.toggle("flow", on);
      if (e.text) e.text.classList.toggle("lit", on);
      if (e.badge) e.badge.classList.toggle("lit", on);
    });
  }
  function restore() {
    if (pinned) { focus(pinned); return; }
    stage.removeAttribute("data-active");
    lanesEl.querySelectorAll(".sm-node.lit").forEach((n) => n.classList.remove("lit"));
    edges.forEach((e) => {
      e.path.classList.remove("lit", "flow");
      if (e.text) e.text.classList.remove("lit");
      if (e.badge) e.badge.classList.remove("lit");
    });
  }

  let raf = 0;
  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; layout(); });
  }
  window.addEventListener("resize", schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);

  window.__setupSysmap = function () {
    if (!built) build();
    schedule();
    setTimeout(layout, 60);
    setTimeout(layout, 260);
  };
})();

/* ---------- generic lane-graph explorer (shared by C4, state machines, event arch) ---------- */
function initExplorer(root, views, order, opts) {
  opts = opts || {};
  if (!root) return { setup() {} };
  const tabsEl = root.querySelector(".c4-tabs");
  const blurbEl = root.querySelector(".c4-blurb");
  const lanesEl = root.querySelector(".exp-lanes");
  const canvas = root.querySelector(".sm-canvas");
  const svg = root.querySelector(".sm-edges");
  const stage = root.querySelector(".sysmap-stage");
  const detail = root.querySelector(".sm-detail");
  const marker = "url(#" + svg.querySelector("marker").id + ")";
  const SVGNS = "http://www.w3.org/2000/svg";
  const NORMALS = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1] };
  let level = order[0];
  let pinned = null;
  let edges = [];

  const bez = (t, a, b, c, d) => { const u = 1 - t; return u * u * u * a + 3 * u * u * t * b + 3 * u * t * t * c + t * t * t * d; };
  function rectIn(el) {
    const r = el.getBoundingClientRect(), c = canvas.getBoundingClientRect();
    return { x: r.left - c.left, y: r.top - c.top, w: r.width, h: r.height };
  }
  function sides(f, t) {
    const dx = t.x + t.w / 2 - (f.x + f.w / 2), dy = t.y + t.h / 2 - (f.y + f.h / 2);
    if (Math.abs(dx) >= Math.abs(dy)) return [dx > 0 ? "r" : "l", dx > 0 ? "l" : "r"];
    return [dy > 0 ? "b" : "t", dy > 0 ? "t" : "b"];
  }
  function anchor(r, s) {
    if (s === "r") return [r.x + r.w, r.y + r.h / 2];
    if (s === "l") return [r.x, r.y + r.h / 2];
    if (s === "t") return [r.x + r.w / 2, r.y];
    return [r.x + r.w / 2, r.y + r.h];
  }
  const resolve = (id) => lanesEl.querySelector('.sm-node[data-id="' + CSS.escape(id) + '"]');

  function renderTabs() {
    if (tabsEl == null) return;
    if (order.length < 2) { tabsEl.hidden = true; return; }
    tabsEl.innerHTML = "";
    order.forEach((id, i) => {
      if (i) {
        const sep = document.createElement("span");
        sep.className = "c4-sep";
        sep.textContent = "›";
        tabsEl.appendChild(sep);
      }
      const b = document.createElement("button");
      b.type = "button";
      b.className = "c4-tab" + (id === level ? " active" : "");
      b.textContent = views[id].tab;
      b.addEventListener("click", () => go(id));
      tabsEl.appendChild(b);
    });
  }
  function go(id) {
    level = id;
    pinned = null;
    if (detail) detail.hidden = true;
    renderTabs();
    render();
  }

  function render() {
    const data = views[level];
    if (blurbEl) blurbEl.innerHTML = data.blurb || "";
    lanesEl.innerHTML = "";
    svg.querySelectorAll(".sm-edge, .sm-elabel").forEach((n) => n.remove());
    edges = [];

    lanesEl.classList.toggle("vertical", !!opts.vertical);
    stage.classList.toggle("vmode", !!opts.vertical);
    if (opts.vertical) {
      lanesEl.style.gridTemplateColumns = "";
      canvas.style.minWidth = (data.minW || 540) + "px";
    } else {
      lanesEl.style.gridTemplateColumns = data.lanes
        .map((l) => l.w || "minmax(136px, 1fr)")
        .join(" ");
      canvas.style.minWidth = Math.max(700, data.lanes.length * 168) + "px";
    }

    data.lanes.forEach((lane) => {
      const col = document.createElement("div");
      col.className = "sm-lane " + lane.id + (lane.box ? " box" : "");
      col.innerHTML = '<div class="sm-lane-title">' + lane.title + "</div>";
      const body = document.createElement("div");
      body.className = "sm-lane-body";
      data.nodes.filter((n) => n.lane === lane.id).forEach((n) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "sm-node" + (n.cls ? " " + n.cls : "") + (n.drill ? " drill" : "");
        b.dataset.id = n.id;
        const ic = n.icon ? '<span class="ic">' + n.icon + "</span>" : "";
        b.innerHTML = ic + '<span class="txt"><span class="lbl">' + n.label +
          "</span>" + (n.sub ? '<span class="sub">' + n.sub + "</span>" : "") + "</span>";
        b.addEventListener("mouseenter", () => focus(n.id));
        b.addEventListener("mouseleave", restore);
        b.addEventListener("focus", () => focus(n.id));
        b.addEventListener("blur", restore);
        b.addEventListener("click", () => {
          if (!detail) return;
          pinned = pinned === n.id ? null : n.id;
          lanesEl.querySelectorAll(".sm-node.sel").forEach((el) => el.classList.remove("sel"));
          if (!pinned) { restore(); detail.hidden = true; return; }
          b.classList.add("sel");
          focus(n.id);
          detail.innerHTML =
            "<h4>" + (n.icon ? n.icon + "&nbsp; " : "") + n.label +
            (n.sub ? "  <span style='color:var(--muted);font-weight:600'>· " + n.sub + "</span>" : "") + "</h4>" +
            "<p>" + (n.detail || "") + "</p>" +
            (n.drill ? '<button type="button" class="sm-drill" data-drill="' + n.drill + '">Zoom in to ' + views[n.drill].tab + " &rarr;</button>" : "");
          detail.hidden = false;
        });
        body.appendChild(b);
      });
      col.appendChild(body);
      lanesEl.appendChild(col);
    });

    data.edges.forEach(([a, b, label, kind]) => {
      const p = document.createElementNS(SVGNS, "path");
      p.setAttribute("class", "sm-edge " + kind);
      p.setAttribute("marker-end", marker);
      svg.appendChild(p);
      let t = null;
      if (label) {
        t = document.createElementNS(SVGNS, "text");
        t.setAttribute("class", "sm-elabel");
        t.setAttribute("text-anchor", "middle");
        t.textContent = label;
        svg.appendChild(t);
      }
      edges.push({ a, b, kind, path: p, text: t });
    });

    schedule();
    setTimeout(layout, 60);
    setTimeout(layout, 260);
  }

  function layout() {
    if (!canvas.offsetWidth || !edges.length) return;
    const W = canvas.offsetWidth, H = canvas.offsetHeight;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("width", W);
    svg.setAttribute("height", H);
    edges.forEach((e) => {
      const fe = resolve(e.a), te = resolve(e.b);
      if (!fe || !te) return;
      const fr = rectIn(fe), tr = rectIn(te);
      const fcy = fr.y + fr.h / 2, tcy = tr.y + tr.h / 2;
      let s1, s2;
      let bracket = 0; // 0 = normal, +1 = bow right, -1 = bow left
      if (opts.vertical && e.a !== e.b) {
        const dyc = tcy - fcy;
        if (Math.abs(dyc) < 40) { [s1, s2] = sides(fr, tr); }        // same band → sideways
        else if (e.kind === "ext") { s1 = "r"; s2 = "r"; bracket = 1; } // failure branch → bow right
        else if (Math.abs(dyc) > 150) { s1 = "l"; s2 = "l"; bracket = -1; } // skips a band → bow left
        else { const up = dyc < 0; s1 = up ? "t" : "b"; s2 = up ? "b" : "t"; } // adjacent band → straight
      } else {
        [s1, s2] = sides(fr, tr);
      }
      let [x1, y1] = anchor(fr, s1);
      let [x2, y2] = anchor(tr, s2);
      const reverse = edges.some((o) => o !== e && o.a === e.b && o.b === e.a);
      if (reverse) {
        const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1;
        const off = (e.a < e.b ? 1 : -1) * 10;
        x1 += (-dy / L) * off; y1 += (dx / L) * off;
        x2 += (-dy / L) * off; y2 += (dx / L) * off;
      }
      let c1x, c1y, c2x, c2y;
      if (bracket) {
        const reach = bracket * Math.max(50, Math.min(104, Math.abs(y2 - y1) * 0.4));
        c1x = x1 + reach; c1y = y1 + (y2 - y1) * 0.15;
        c2x = x2 + reach; c2y = y2 - (y2 - y1) * 0.15;
      } else {
        const k = Math.max(30, Math.min(140, Math.hypot(x2 - x1, y2 - y1) * 0.4));
        const n1 = NORMALS[s1], n2 = NORMALS[s2];
        c1x = x1 + n1[0] * k; c1y = y1 + n1[1] * k; c2x = x2 + n2[0] * k; c2y = y2 + n2[1] * k;
      }
      e.path.setAttribute("d", "M " + x1 + " " + y1 + " C " + c1x + " " + c1y + " " + c2x + " " + c2y + " " + x2 + " " + y2);
      if (e.text) {
        e.text.setAttribute("x", bez(0.36, x1, c1x, c2x, x2));
        e.text.setAttribute("y", bez(0.36, y1, c1y, c2y, y2) - 4);
      }
    });
  }

  function connected(id) {
    const nodes = new Set([id]), idx = new Set();
    edges.forEach((e, i) => { if (e.a === id || e.b === id) { idx.add(i); nodes.add(e.a); nodes.add(e.b); } });
    return { nodes, idx };
  }
  function focus(id) {
    const { nodes, idx } = connected(id);
    stage.setAttribute("data-active", "");
    lanesEl.querySelectorAll(".sm-node").forEach((n) => n.classList.toggle("lit", nodes.has(n.dataset.id)));
    edges.forEach((e, i) => {
      const on = idx.has(i);
      e.path.classList.toggle("lit", on);
      e.path.classList.toggle("flow", on);
      if (e.text) e.text.classList.toggle("lit", on);
    });
  }
  function restore() {
    if (pinned) { focus(pinned); return; }
    stage.removeAttribute("data-active");
    lanesEl.querySelectorAll(".sm-node.lit").forEach((n) => n.classList.remove("lit"));
    edges.forEach((e) => { e.path.classList.remove("lit", "flow"); if (e.text) e.text.classList.remove("lit"); });
  }

  if (detail) {
    detail.addEventListener("click", (ev) => {
      const btn = ev.target.closest(".sm-drill");
      if (btn) go(btn.dataset.drill);
    });
  }
  stage.addEventListener("click", (ev) => {
    if (ev.target === stage || ev.target === canvas || ev.target === lanesEl) {
      pinned = null;
      lanesEl.querySelectorAll(".sm-node.sel").forEach((el) => el.classList.remove("sel"));
      restore();
      if (detail) detail.hidden = true;
    }
  });

  let raf = 0;
  function schedule() {
    if (raf) return;
    raf = requestAnimationFrame(() => { raf = 0; layout(); });
  }
  window.addEventListener("resize", schedule);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(schedule);

  let started = false;
  return {
    setup() {
      if (!started) { started = true; renderTabs(); render(); }
      else schedule();
    },
  };
}

const SM_PARTS = {
  booking: initExplorer(document.getElementById("smPartBooking"), STATE_MACHINES, ["booking"], { vertical: true }),
  order: initExplorer(document.getElementById("smPartOrder"), STATE_MACHINES, ["order"], { vertical: true }),
  payment: initExplorer(document.getElementById("smPartPayment"), STATE_MACHINES, ["payment"], { vertical: true }),
};
const EXPLORERS = {
  "c4-model": initExplorer(document.getElementById("c4x"), C4, C4_ORDER, { drill: true }),
  "event-architecture": initExplorer(document.getElementById("evx"), EVENT_ARCH, ["main"], { vertical: true }),
};
(function () {
  const root = document.getElementById("smx");
  const tabs = document.getElementById("smTabs");
  if (!root || !tabs) return;
  let current = "booking";
  const cap = (k) => k[0].toUpperCase() + k.slice(1);
  const partOf = (k) => document.getElementById("smPart" + cap(k));

  function showView(part, view) {
    part.querySelectorAll(".sm-subtab").forEach((b) => b.classList.toggle("active", b.dataset.view === view));
    part.querySelectorAll(".sm-view").forEach((v) => { v.hidden = v.dataset.view !== view; });
    if (view === "diagram") SM_PARTS[part.dataset.sm].setup();
  }
  function showPart(key) {
    current = key;
    tabs.querySelectorAll(".c4-tab").forEach((b) => b.classList.toggle("active", b.dataset.sm === key));
    ["booking", "order", "payment"].forEach((k) => { partOf(k).hidden = k !== key; });
    const part = partOf(key);
    if ((part.querySelector(".sm-subtab.active") || {}).dataset?.view === "diagram") SM_PARTS[key].setup();
  }

  tabs.addEventListener("click", (e) => {
    const b = e.target.closest(".c4-tab");
    if (b && b.dataset.sm) showPart(b.dataset.sm);
  });
  root.addEventListener("click", (e) => {
    const b = e.target.closest(".sm-subtab");
    if (b) showView(b.closest(".sm-part"), b.dataset.view);
  });
  EXPLORERS["state-machine"] = { setup() { showPart(current); } };
})();
window.__setupC4 = () => EXPLORERS["c4-model"] && EXPLORERS["c4-model"].setup();

function show(id) {
  const target = SECTIONS.some((s) => s.id === id) ? id : SECTIONS[0].id;
  document.querySelectorAll(".panel").forEach((p) => p.classList.toggle("active", p.id === "panel-" + target));
  document.querySelectorAll(".nav-link").forEach((n) => n.classList.toggle("active", n.dataset.id === target));
  window.scrollTo(0, 0);
  renderDiagrams(document.getElementById("panel-" + target));
  if (target === "system-overview" && window.__setupSysmap) window.__setupSysmap();
  if (EXPLORERS[target]) EXPLORERS[target].setup();
}

navList.addEventListener("click", (e) => {
  const link = e.target.closest(".nav-link");
  if (!link) return;
  e.preventDefault();
  history.replaceState(null, "", "#" + link.dataset.id);
  show(link.dataset.id);
});

window.addEventListener("hashchange", () => show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
