server:
  port: 8090

spring:
  application:
    name: flight-search
  datasource:
    url: jdbc:postgresql://localhost:5434/travel
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

duffel:
  api-key: ${DUFFEL_API_KEY}
  base-url: https://api.duffel.com
  version: v2
  timeout-ms: 10000
  airports:
    sync:
      enabled: true
      cron: "0 0 3 ? * MON"
