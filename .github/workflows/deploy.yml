name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

# OIDC: the job assumes an AWS IAM role with a short-lived token instead of a
# stored SSH key. No inbound SSH is used — the deploy runs on the box via SSM.
permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-aws
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ap-south-1

      - name: Deploy on the instance via SSM
        env:
          INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail

          PARAMS='{"executionTimeout":["1800"],"commands":["cd /home/ec2-user/travel-ai","sudo -u ec2-user git config --global --add safe.directory /home/ec2-user/travel-ai","sudo -u ec2-user git fetch origin main","sudo -u ec2-user git reset --hard origin/main","sudo -u ec2-user bash config/deploy-remote.sh"]}'

          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "gha deploy ${GITHUB_SHA::7}" \
            --parameters "$PARAMS" \
            --query "Command.CommandId" --output text)
          echo "SSM command: $CMD_ID"

          while :; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep 10
          done

          echo "----- remote stdout -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          echo "----- remote stderr -----"
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query StandardErrorContent --output text

          echo "final status: $STATUS"
          [ "$STATUS" = "Success" ]

      - name: Verify the public endpoint
        run: |
          curl -sSfL --retry 5 --retry-delay 5 -o /dev/null \
            https://www.aatikatechstack.com/actuator/health
          echo "https://www.aatikatechstack.com/actuator/health -> OK"
